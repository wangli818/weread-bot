name: Renew Cookie

# 轻量定时续期：每 6 小时调用一次 renewal 接口刷新 wr_skey 并写回 Secret，
# 防止 cookie 长期不调用而过期。不启动阅读会话，运行很快（通常 < 30s）。
# 前提：当前 WEREAD_CURL_STRING 里的 wr_skey 仍可被 renewal 接口认证；
# 若已彻底失效，本任务会安全跳过（不写回任何东西），需手动重新抓 curl。

on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时（UTC 00:00/06:00/12:00/18:00）
  workflow_dispatch:

jobs:
  renew-cookie:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      secrets: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create config file
      run: |
        cat > config.yaml <<EOF
        app:
          name: "WeReadBot-CookieRenew"
          startup_mode: "immediate"
          startup_delay: "1-2"

        reading:
          mode: "smart_random"
          target_duration: "1-2"
          reading_interval: "30-48"
          use_curl_data_first: true
          fallback_to_config: true
          smart_random:
            book_continuity: 0.8
            chapter_continuity: 0.7
            book_switch_cooldown: 3600

        human_simulation:
          enabled: false

        network:
          timeout: 30
          retry_times: 3
          retry_delay: "5-15"
          rate_limit: 10

        notification:
          enabled: true
          include_statistics: true
          only_on_failure: true
          triggers:
            session_success: false
            multi_user_summary: false
            session_failure: true
            runtime_error: true
            general: true

        logging:
          level: "INFO"
          format: "detailed"
          file: "logs/weread.log"
          max_size: "10MB"
          backup_count: 5
          console: true

        history:
          enabled: false
          file: "logs/run-history.json"
          max_entries: 50
          persist_runtime_error: true
        EOF

    - name: Create logs directory
      run: mkdir -p logs

    - name: Run Cookie renewal only
      env:
        HACK_COOKIE_REFRESH_QL: ${{ secrets.HACK_COOKIE_REFRESH_QL }}
        WEREAD_CURL_STRING: ${{ secrets.WEREAD_CURL_STRING }}
        MAX_CONCURRENT_USERS: ${{ secrets.MAX_CONCURRENT_USERS || 1 }}
        # 通知相关环境变量（仅失败时通知，复用 auto-reading 同款通道）
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        APPRISE_URL: ${{ secrets.APPRISE_URL }}
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
        BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        BARK_SOUND: ${{ secrets.BARK_SOUND }}
        NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        FEISHU_MSG_TYPE: ${{ secrets.FEISHU_MSG_TYPE }}
        WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
        WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        DINGTALK_MSG_TYPE: ${{ secrets.DINGTALK_MSG_TYPE }}
        GOTIFY_SERVER: ${{ secrets.GOTIFY_SERVER }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        GOTIFY_TITLE: ${{ secrets.GOTIFY_TITLE }}
        SERVERCHAN3_UID: ${{ secrets.SERVERCHAN3_UID }}
        SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
        SERVERCHAN3_TAGS: ${{ secrets.SERVERCHAN3_TAGS }}
        SERVERCHAN3_SHORT: ${{ secrets.SERVERCHAN3_SHORT }}
        PUSHDEER_PUSHKEY: ${{ secrets.PUSHDEER_PUSHKEY }}
        PUSHDEER_TYPE: ${{ secrets.PUSHDEER_TYPE }}
        NOTIFICATION_ONLY_ON_FAILURE: ${{ secrets.NOTIFICATION_ONLY_ON_FAILURE || 'true' }}
        TZ: 'Asia/Shanghai'
      run: |
        echo "开始 Cookie 续期任务..."
        echo "当前时间: $(date)"
        echo "================================"
        python weread-bot.py --config config.yaml --renew-only

    - name: Persist refreshed cookie to Secret
      if: always()
      env:
        WEREAD_CURL_STRING: ${{ secrets.WEREAD_CURL_STRING }}
        # fork 仓库默认 GITHUB_TOKEN 无 secrets:write 权限；
        # 如需持久化 wr_skey，请新建 fine-grained PAT（含 Actions/secrets:write）并存为仓库 Secret GH_PAT
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        python - <<'PY'
        import json, os, subprocess, sys

        mapping_file = ".refreshed-skey.json"
        mapping = {}
        if os.path.exists(mapping_file):
            try:
                with open(mapping_file, encoding="utf-8") as f:
                    mapping = json.load(f)
                if not isinstance(mapping, dict):
                    mapping = {}
            except (json.JSONDecodeError, OSError) as e:
                print(f"::warning::读取 {mapping_file} 失败: {e}")

        curl = os.environ.get("WEREAD_CURL_STRING", "")
        if not mapping:
            print("::notice::无 wr_skey 刷新记录，跳过持久化（renewal 可能未触发或已失败）")
            sys.exit(0)
        if not curl:
            print("::warning::WEREAD_CURL_STRING 为空，无法写回 Secret")
            sys.exit(0)

        changed = False
        for user, info in mapping.items():
            old = info.get("old_skey") or ""
            new = info.get("new_skey") or ""
            if old and new and old in curl:
                curl = curl.replace(old, new)
                changed = True
                print(f"::notice::已替换用户 {user} 的 wr_skey")
            elif old and new:
                print(f"::warning::用户 {user} 的旧 wr_skey 未在 WEREAD_CURL_STRING 中找到（可能已被上次持久化更新），跳过")

        if not changed:
            print("::notice::无需更新，WEREAD_CURL_STRING 保持不变")
            sys.exit(0)

        result = subprocess.run(
            ["gh", "secret", "set", "WEREAD_CURL_STRING"],
            input=curl.encode("utf-8"),
            capture_output=True,
        )
        if result.returncode != 0:
            print(f"::error::gh secret set 失败: {result.stderr.decode('utf-8', 'ignore')}")
            print("::notice::如为 fork 仓库，默认 GITHUB_TOKEN 无 secrets:write 权限，请创建 fine-grained PAT 存为 Secret GH_PAT")
            sys.exit(1)
        print("::notice::WEREAD_CURL_STRING 已用刷新后的 wr_skey 更新")

        # 清理映射文件，避免泄露明文 cookie
        try:
            os.remove(mapping_file)
        except OSError:
            pass
        PY

    - name: Upload renewal log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: weread-renew-${{ github.run_id }}
        path: logs/weread.log
        if-no-files-found: warn
        retention-days: 3
