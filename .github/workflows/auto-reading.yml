name: Auto Reading Bot

on:
  # 定时触发 - Fork 后如需自动定时运行，请取消下方 schedule 注释
  # 每天 3 班、每班约 20 分钟，合计约 1 小时阅读。
  # 排 3 班的原因：GitHub 的 schedule 是"尽力而为"，实测会比 cron 晚 4~8 小时
  # 启动（甚至丢弃）。多排几班，即使某一班被拖或被丢，一天里仍能凑够时长。
  # 全部避开整点（00 分是排队高峰），并让"延迟后的实际时间"落在白天。
  schedule:
    - cron: '37 22 * * *'  # UTC 22:37 = 北京 06:37（延迟后约上午）
    - cron: '17 2 * * *'   # UTC 02:17 = 北京 10:17（延迟后约下午）
    - cron: '43 6 * * *'   # UTC 06:43 = 北京 14:43（延迟后约晚上）
  
  # 拉取请求触发，用于测试阅读
  pull_request:
    branches: [ main ]
    paths:
      - 'weread-bot.py'
      - 'requirements.txt'
      - '.github/workflows/auto-reading.yml'
      - '.github/workflows/ci.yml'

  # 手动触发
  workflow_dispatch:
    inputs:
      target_duration:
        description: '阅读时长（分钟，格式：18-22。留空时优先使用仓库 Secret TARGET_DURATION，否则默认 18-22）'
        required: false
        default: ''
        type: string
      reading_mode:
        description: '阅读模式'
        required: false
        default: 'smart_random'
        type: choice
        options:
        - smart_random
        - sequential
        - pure_random
      notify_enabled:
        description: '启用通知'
        required: false
        default: true
        type: boolean
      notify_only_on_failure:
        description: '仅失败时发送通知'
        required: false
        default: false
        type: boolean
      history_enabled:
        description: '启用执行历史持久化'
        required: false
        default: true
        type: boolean
      history_max_entries:
        description: '执行历史最多保留多少条'
        required: false
        default: '50'
        type: string

jobs:
  auto-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 2小时超时
    # 一天 3 班，延迟抖动可能让两班撞在一起。这里让它们排队而不是并行执行：
    # 同一账号同时开两轮阅读会话容易触发风控（仓库文档也明确不建议）。
    concurrency:
      group: weread-auto-reading
      cancel-in-progress: false
    # 仅声明最小 permissions（contents: read），避开 fork 仓库禁用的
    # secrets: write / workflows: write，否则 startup_failure。
    # 写回 Secret 持久化走 GH_PAT + REST API，不依赖 GITHUB_TOKEN 权限。
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Resolve runtime parameters
      env:
        INPUT_TARGET_DURATION: ${{ github.event.inputs.target_duration }}
        SECRET_TARGET_DURATION: ${{ secrets.TARGET_DURATION }}
      run: |
        target_duration="${INPUT_TARGET_DURATION}"

        if [ -z "$target_duration" ]; then
          target_duration="${SECRET_TARGET_DURATION}"
        fi

        if [ -z "$target_duration" ]; then
          target_duration="18-22"
        fi

        echo "TARGET_DURATION=$target_duration" >> "$GITHUB_ENV"

    - name: Create config file
      run: |
        cat > config.yaml <<EOF
        app:
          name: "WeReadBot-GitHub-Action"
          startup_mode: "immediate"
          startup_delay: "1-2"

        reading:
          mode: "${{ github.event.inputs.reading_mode || 'smart_random' }}"
          # 目标阅读时长（分钟），支持区间随机，格式如："1" 或 "1-2"
          target_duration: "${TARGET_DURATION}"
          reading_interval: "30-48"
          use_curl_data_first: true
          fallback_to_config: true
          smart_random:
            book_continuity: 0.8
            chapter_continuity: 0.7
            book_switch_cooldown: 3600

        human_simulation:
          enabled: false
          reading_speed_variation: true
          break_probability: 0.15
          break_duration: "10-20"
          rotate_user_agent: false

        network:
          timeout: 30
          retry_times: 3
          retry_delay: "5-15"
          rate_limit: 10

        notification:
          enabled: ${{ github.event.inputs.notify_enabled != 'false' }}
          include_statistics: true
          only_on_failure: ${{ github.event.inputs.notify_only_on_failure == 'true' }}
          triggers:
            session_success: ${{ github.event.inputs.notify_only_on_failure != 'true' }}
            multi_user_summary: ${{ github.event.inputs.notify_only_on_failure != 'true' }}
            session_failure: true
            runtime_error: true
            general: true

        logging:
          level: "INFO"
          format: "detailed"
          file: "logs/weread.log"
          max_size: "10MB"
          backup_count: 5
          console: true

        history:
          enabled: ${{ github.event.inputs.history_enabled != 'false' }}
          file: "logs/run-history.json"
          max_entries: ${{ github.event.inputs.history_max_entries || '50' }}
          persist_runtime_error: true
        EOF

    - name: Create logs directory
      run: mkdir -p logs

    - name: Run WeRead Bot
      env:
        # Cookie刷新QL属性，根据不同用户的环境，可能需要设置为True或False来确保cookie刷新正常工作，默认值为false
        HACK_COOKIE_REFRESH_QL: ${{ secrets.HACK_COOKIE_REFRESH_QL }}
        # 多用户 cURL：在 WEREAD_CURL_STRING 中放置多段 curl，段与段之间至少插入两个空行
        WEREAD_CURL_STRING: ${{ secrets.WEREAD_CURL_STRING }}
        # 多用户并发控制，未设置默认 1（顺序执行）
        MAX_CONCURRENT_USERS: ${{ secrets.MAX_CONCURRENT_USERS || 1 }}
        # 单用户连续阅读失败上限，未设置时默认 5
        MAX_CONSECUTIVE_FAILURES: ${{ secrets.MAX_CONSECUTIVE_FAILURES || 5 }}
        # 通知相关环境变量
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        APPRISE_URL: ${{ secrets.APPRISE_URL }}
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
        BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        BARK_SOUND: ${{ secrets.BARK_SOUND }}
        NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        FEISHU_MSG_TYPE: ${{ secrets.FEISHU_MSG_TYPE }}
        WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
        WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        DINGTALK_MSG_TYPE: ${{ secrets.DINGTALK_MSG_TYPE }}
        GOTIFY_SERVER: ${{ secrets.GOTIFY_SERVER }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        GOTIFY_TITLE: ${{ secrets.GOTIFY_TITLE }}
        # 代理设置（可选）
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        SERVERCHAN3_UID: ${{ secrets.SERVERCHAN3_UID }}
        SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
        SERVERCHAN3_TAGS: ${{ secrets.SERVERCHAN3_TAGS }}
        SERVERCHAN3_SHORT: ${{ secrets.SERVERCHAN3_SHORT }}
        PUSHDEER_PUSHKEY: ${{ secrets.PUSHDEER_PUSHKEY }}
        PUSHDEER_TYPE: ${{ secrets.PUSHDEER_TYPE }}
        # 手动触发时强制"成功也发通知"（除非你手动勾选了"仅失败时发送通知"），
        # 这样点完 Run workflow 一定能收到本轮结果，不必去页面翻运行记录。
        # 定时触发默认只在失败时通知：一天 3 班，每班都推一份日报会变成刷屏。
        # 想恢复"每班都报"，把这行末尾的 'true' 改回 'false' 即可。
        NOTIFICATION_ONLY_ON_FAILURE: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.notify_only_on_failure == 'true' && 'true' || 'false') || secrets.NOTIFICATION_ONLY_ON_FAILURE || 'true' }}
        HISTORY_ENABLED: ${{ secrets.HISTORY_ENABLED || github.event.inputs.history_enabled == 'true' || 'true' }}
        HISTORY_FILE: ${{ secrets.HISTORY_FILE || 'logs/run-history.json' }}
        HISTORY_MAX_ENTRIES: ${{ secrets.HISTORY_MAX_ENTRIES || github.event.inputs.history_max_entries || '50' }}
        HISTORY_PERSIST_RUNTIME_ERROR: ${{ secrets.HISTORY_PERSIST_RUNTIME_ERROR || 'true' }}
        # 其他环境变量
        TZ: 'Asia/Shanghai'
      run: |
        echo "开始自动阅读任务..."
        echo "当前时间: $(date)"
        echo "运行参数:"
        echo "- 阅读时长: ${TARGET_DURATION}"
        echo "- 阅读模式: ${{ github.event.inputs.reading_mode || 'smart_random' }}"
        echo "- 启用通知: ${{ github.event.inputs.notify_enabled != 'false' }}"
        echo "- 仅失败通知: ${{ github.event.inputs.notify_only_on_failure == 'true' }}"
        echo "- 历史持久化: ${{ github.event.inputs.history_enabled != 'false' }}"
        echo "- 历史保留条数: ${{ github.event.inputs.history_max_entries || '50' }}"
        echo "================================"
        
        # 运行阅读机器人
        python weread-bot.py --config config.yaml

    - name: Persist refreshed cookie to Secret
      if: always()
      env:
        WEREAD_CURL_STRING: ${{ secrets.WEREAD_CURL_STRING }}
        # gh CLI 会优先使用 GH_TOKEN 环境变量作为认证。
        # fork 仓库默认 GITHUB_TOKEN 无 secrets:write 权限，因此需要 GH_PAT：
        #   新建 fine-grained PAT（勾选 Actions/Secrets 读写 + Workflows 读写），
        #   存为仓库 Secret GH_PAT。未配置时安全跳过写回。
        GH_TOKEN: ${{ secrets.GH_PAT }}
      run: |
        python - <<'PY'
        import json, os, subprocess, sys

        mapping_file = ".refreshed-skey.json"
        mapping = {}
        if os.path.exists(mapping_file):
            try:
                with open(mapping_file, encoding="utf-8") as f:
                    mapping = json.load(f)
                if not isinstance(mapping, dict):
                    mapping = {}
            except (json.JSONDecodeError, OSError) as e:
                print(f"::warning::读取 {mapping_file} 失败: {e}")

        curl = os.environ.get("WEREAD_CURL_STRING", "")
        gh_token = os.environ.get("GH_TOKEN", "")
        if not mapping:
            print("::notice::无 wr_skey 刷新记录，跳过持久化（本次可能未触发 renewal）")
            sys.exit(0)
        if not curl:
            print("::warning::WEREAD_CURL_STRING 为空，无法写回 Secret")
            sys.exit(0)
        if not gh_token:
            print("::notice::未配置 Secret GH_PAT（含 Actions/Secrets/Workflows 读写权限的 fine-grained PAT），跳过写回。"
                  "如需自动持久化 wr_skey，请按 README 说明配置 GH_PAT。")
            sys.exit(0)

        changed = False
        for user, info in mapping.items():
            old = info.get("old_skey") or ""
            new = info.get("new_skey") or ""
            if old and new and old in curl:
                curl = curl.replace(old, new)
                changed = True
                print(f"::notice::已替换用户 {user} 的 wr_skey")
            elif old and new:
                print(f"::warning::用户 {user} 的旧 wr_skey 未在 WEREAD_CURL_STRING 中找到（可能已被上次持久化更新），跳过")

        if not changed:
            print("::notice::无需更新，WEREAD_CURL_STRING 保持不变")
            sys.exit(0)

        result = subprocess.run(
            ["gh", "secret", "set", "WEREAD_CURL_STRING"],
            input=curl.encode("utf-8"),
            capture_output=True,
        )
        if result.returncode != 0:
            stderr = result.stderr.decode("utf-8", "ignore")
            print(f"::error::gh secret set 失败: {stderr}")
            if "HTTP 403" in stderr or "scopes" in stderr.lower():
                print("::notice::403 通常是 GH_PAT 权限不足，请确认它含 Actions + Secrets + Workflows 读写权限，且目标仓库是本仓库。")
            sys.exit(1)
        print("::notice::WEREAD_CURL_STRING 已用刷新后的 wr_skey 更新")

        # 清理映射文件，避免泄露明文 cookie
        try:
            os.remove(mapping_file)
        except OSError:
            pass
        PY

    - name: Upload runtime artifacts
      # PR 触发的运行不再上传，避免仓库代码派生场景泄露 logs/weread.log 和 run-history.json
      if: always() && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: weread-runtime-${{ github.run_id }}
        path: |
          logs/weread.log
          logs/run-history.json
        if-no-files-found: warn
        retention-days: 1

    - name: Notify on startup failure
      # 补位：阅读会话还没开始就失败时，weread-bot.py 的 main() 还没走到发通知的分支
      # （run_started 为 False），没人会告诉你。这里补发一条。
      # 判据是 logs/run-history.json：bot 只有真正进入阅读会话后才写这个文件，
      # 所以文件不存在 == bot 自己没发过通知，不会重复打扰。
      # 放在最后一个 step，才能覆盖前面的 checkout / 装依赖 / 生成 config 等失败。
      if: failure() && hashFiles('logs/run-history.json') == ''
      continue-on-error: true
      env:
        # 仅通知类 Secret，字段与上面 "Run WeRead Bot" 保持一致；新增通道时两处都要加
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        APPRISE_URL: ${{ secrets.APPRISE_URL }}
        BARK_SERVER: ${{ secrets.BARK_SERVER }}
        BARK_DEVICE_KEY: ${{ secrets.BARK_DEVICE_KEY }}
        BARK_SOUND: ${{ secrets.BARK_SOUND }}
        NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        FEISHU_MSG_TYPE: ${{ secrets.FEISHU_MSG_TYPE }}
        WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
        WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
        DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        DINGTALK_MSG_TYPE: ${{ secrets.DINGTALK_MSG_TYPE }}
        GOTIFY_SERVER: ${{ secrets.GOTIFY_SERVER }}
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        GOTIFY_PRIORITY: ${{ secrets.GOTIFY_PRIORITY }}
        GOTIFY_TITLE: ${{ secrets.GOTIFY_TITLE }}
        SERVERCHAN3_UID: ${{ secrets.SERVERCHAN3_UID }}
        SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
        SERVERCHAN3_TAGS: ${{ secrets.SERVERCHAN3_TAGS }}
        SERVERCHAN3_SHORT: ${{ secrets.SERVERCHAN3_SHORT }}
        PUSHDEER_PUSHKEY: ${{ secrets.PUSHDEER_PUSHKEY }}
        PUSHDEER_TYPE: ${{ secrets.PUSHDEER_TYPE }}
        TRIGGER_EVENT: ${{ github.event_name }}
        RUN_NUMBER: ${{ github.run_number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        cat > "$RUNNER_TEMP/failure-message.txt" <<EOF
        ❌ 微信读书 Auto Reading 作业失败（阅读会话未启动）

        仓库：${GITHUB_REPOSITORY}
        触发方式：${TRIGGER_EVENT}
        运行：#${RUN_NUMBER}
        时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')（北京时间）

        logs/run-history.json 没有生成，说明阅读会话还没开始就失败了。
        常见原因：Secret 缺失或失效、config.yaml 生成失败、依赖安装失败、
        WEREAD_CURL_STRING 校验不通过（cookie 过期）等。

        详情：${RUN_URL}
        EOF
        python scripts/notify.py "$(cat "$RUNNER_TEMP/failure-message.txt")" --event session_failure

